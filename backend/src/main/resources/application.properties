spring.application.name=sports-app-backend

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/sports_app
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

football-data.base-url=${FOOTBALL_DATA_BASE_URL:https://api.football-data.org/v4}
football-data.api-token=${FOOTBALL_DATA_API_TOKEN:}
api-football.base-url=${API_FOOTBALL_BASE_URL:https://v3.football.api-sports.io}
api-football.api-key=${API_FOOTBALL_API_KEY:}

# Automatic external sync (milliseconds)
sports.sync.auto.initial-delay-ms=45000
sports.sync.auto.fixed-delay-ms=180000
